<main class="main">

    <div class="user"><div class="avatar">DS</div><div><b>Dược sĩ</b><span>Đang đăng nhập</span></div></div>
  </header>

  <div class="page-title">
    <h1>TÊN TRANG</h1>
    <p>Mô tả ngắn một dòng</p>
  </div>

  <!-- ============ NỘI DUNG TRANG: làm việc ở đây ============ -->
  <div class="panel">
    <div class="panel-head"><h2>Danh sách</h2></div>
    <div class="toolbar">
      <div class="search"><i class="fa-solid fa-magnifying-glass"></i><input type="search" id="q" placeholder="Tìm kiếm"></div>

      <table class="tbl">
        <thead><tr><th>Cột 1</th><th>Cột 2</th><th class="r">Cột 3</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="empty" style="display:none"><i class="fa-regular fa-folder-open"></i><b>Chưa có dữ liệu</b></div>
    </div>
  </div>
  <!-- ============ HẾT NỘI DUNG TRANG ============ -->
</main>

<div class="toast-x" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
/* ---------- Cấu hình và hàm dùng chung: giữ nguyên, copy sang mọi trang ---------- */
const API = 'http://localhost:3000';
const USE_MOCK = true;   // true = dùng dữ liệu giả bên dưới; đổi thành false khi API đã sẵn sàng

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => (Math.round(Number(n)) || 0).toLocaleString('vi-VN') + 'đ';
const fmtDate = v => v ? new Date(v).toLocaleDateString('vi-VN') : '';
const phoneOk = s => /^0\d{9}$/.test(String(s).trim());          // 10 số, bắt đầu bằng 0

// Trạng thái lô thuốc theo hạn dùng: đỏ = hết hạn, vàng = còn <= 180 ngày (~6 tháng), xanh = an toàn
function trangThaiLo(hanSuDung) {
  const days = Math.floor((new Date(hanSuDung) - Date.now()) / 86400000);
  if (days < 0)    return { key: 'danger', text: 'Hết hạn',      days };
  if (days <= 180) return { key: 'warn',   text: 'Dưới 6 tháng', days };
  return { key: 'ok', text: 'An toàn', days };
}

// Gọi API: tự thêm địa chỉ gốc, ném lỗi kèm câu thông báo tiếng Việt từ máy chủ
async function api(path, options = {}) {
  const res = await fetch(API + path, { headers: { 'Content-Type': 'application/json' }, ...options });
  const data = await res.json().catch(() => null);
  if (!res.ok) throw new Error((data && data.error) || 'Lỗi máy chủ (' + res.status + ')');
  return data;
}
function toast(msg, isError = false) {
  const t = $('toast'); t.textContent = msg; t.className = 'toast-x show' + (isError ? ' error' : '');
  setTimeout(() => t.classList.remove('show'), 2400);
}

/* ---------- Mẫu "dữ liệu giả -> API thật": mỗi API một hàm như dưới ---------- */
const MOCK_THUOC = [   // đúng tên trường và kiểu dữ liệu như trong AI_CONTEXT.md
  { MaThuoc: 'T0001', TenThuoc: 'Paracetamol 500mg', HoatChat: 'Paracetamol', QuyCach: 'Hộp 10 vỉ x 10 viên', TenNhom: 'Giảm đau - hạ sốt', TongTonKho: 8,  GiaBan: 35000 },
  { MaThuoc: 'T0005', TenThuoc: 'Amoxicillin 500mg', HoatChat: 'Amoxicillin trihydrat', QuyCach: 'Hộp 10 vỉ x 10 viên', TenNhom: 'Kháng sinh', TongTonKho: 150, GiaBan: 78000 }
];
async function layDanhSachThuoc() {
  return USE_MOCK ? MOCK_THUOC : api('/api/thuoc/danhsach');
}

async function render() {
  try {
    const list = await layDanhSachThuoc();
    $('rows').innerHTML = list.map(t => `<tr><td>${esc(t.TenThuoc)}</td><td>${esc(t.HoatChat)}</td><td class="r">${money(t.GiaBan)}</td></tr>`).join('');
    $('empty').style.display = list.length ? 'none' : 'flex';
  } catch (e) { toast(e.message, true); }
}

/* ---------- Menu đang chọn + phím tắt chung (F1 = mở POS) ---------- */
const here = location.pathname.split('/').pop() || 'index.html';
document.querySelectorAll('.sidebar .nav-item').forEach(a => a.classList.toggle('active', a.getAttribute('href') === here));
document.addEventListener('keydown', e => { if (e.key === 'F1') { e.preventDefault(); location.href = 'pos.html'; } });

render();
</script>
</body>
</html>
