<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PharmaPro – Bán hàng (POS)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/theme.css">
  <style>
    html,
    body {
      height: 100%;
    }

    body {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Thanh trên mỏng */
    .bar {
      height: 56px;
      flex: none;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 20px;
    }

    .back {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--ink);
      text-decoration: none;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 8px;
    }

    .back:hover {
      background: #f0f4f2;
      color: var(--brand-dark);
    }

    .mark {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--brand);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: .8rem;
    }

    .bar .grow {
      flex: 1;
    }

    .bar .meta {
      color: var(--muted);
      font-size: 13px;
      display: flex;
      gap: 18px;
      align-items: center;
    }

    .bar .meta b {
      color: var(--ink);
      font-weight: 600;
    }

    /* Bố cục 2 cột POS */
    .pos {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 400px;
      gap: 16px;
      padding: 16px 20px;
    }

    .left,
    .right {
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card-x {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
    }

    /* Tìm kiếm */
    .search-wrap {
      position: relative;
    }

    .search-wrap i.ic {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #8a9a92;
      font-size: 1.05rem;
    }

    #searchInput {
      width: 100%;
      border: 2px solid var(--line);
      border-radius: 12px;
      padding: 14px 70px 14px 46px;
      font-size: 1.05rem;
      background: var(--surface);
    }

    #searchInput:focus {
      outline: none;
      border-color: var(--brand);
      box-shadow: 0 0 0 4px var(--brand-soft);
    }

    .search-wrap kbd {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: #eef2f0;
      color: var(--muted);
      border-radius: 6px;
      font-size: 11px;
      padding: 2px 7px;
    }

    #results {
      position: absolute;
      z-index: 20;
      left: 0;
      right: 0;
      top: calc(100% + 6px);
      max-height: 340px;
      overflow-y: auto;
      box-shadow: 0 12px 30px rgba(22, 34, 29, .14);
      display: none;
    }

    .res {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 16px;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
    }

    .res:last-child {
      border-bottom: 0;
    }

    .res:hover,
    .res.on {
      background: var(--brand-soft);
    }

    .res .nm {
      font-weight: 600;
    }

    .res .sub {
      font-size: 12px;
      color: var(--muted);
    }

    .res .pr {
      margin-left: auto;
      font-weight: 600;
      white-space: nowrap;
      text-align: right;
    }

    /* Giỏ hàng */
    .cart {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .cart-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
    }

    .cart-head h2 {
      font-size: 1rem;
      font-weight: 600;
      margin: 0;
    }

    .cart-body {
      flex: 1;
      overflow-y: auto;
    }

    .qty {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 9px;
      overflow: hidden;
    }

    .qty button {
      width: 30px;
      height: 32px;
      border: 0;
      background: #f5f7f6;
      cursor: pointer;
      color: var(--ink);
    }

    .qty button:hover {
      background: var(--brand-soft);
    }

    .qty input {
      width: 44px;
      height: 32px;
      border: 0;
      text-align: center;
      font-weight: 600;
    }

    .qty input::-webkit-outer-spin-button,
    .qty input::-webkit-inner-spin-button {
      -webkit-appearance: none;
    }

    /* Khung thanh toán bên phải */
    .pay {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 18px;
      gap: 12px;
      min-height: 0;
      overflow-y: auto;
    }

    .rx-box {
      background: var(--warn-soft);
      border: 1px solid #fbd097;
      border-radius: 10px;
      padding: 12px;
      display: none;
    }

    .rx-box.show {
      display: block;
    }

    .total {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding-top: 12px;
      border-top: 1px dashed var(--line);
      margin-top: auto;
    }

    .total strong {
      font-size: 1.8rem;
      color: var(--brand-dark);
      letter-spacing: -.5px;
    }

    @media (max-width: 991px) {
      body {
        overflow: auto;
      }

      .pos {
        grid-template-columns: 1fr;
        display: flex;
        flex-direction: column;
      }

      .bar .meta {
        display: none;
      }
    }
  </style>
</head>

<body>

  <header class="bar">
    <a href="index.html" class="back"><i class="fa-solid fa-arrow-left"></i><span class="mark"><i
          class="fa-solid fa-staff-snake"></i></span>PharmaPro</a>
    <span class="grow"></span>
    <div class="meta">
      <span>Dược sĩ: <b>Trần Thị Thu Hà</b></span>
      <span><i class="fa-regular fa-clock"></i> <b id="clock">--:--</b></span>
    </div>
  </header>

  <div class="pos">
    <!-- TRÁI: Tìm kiếm & Giỏ hàng -->
    <section class="left">
      <div class="search-wrap">
        <i class="fa-solid fa-magnifying-glass ic"></i>
        <input type="text" id="searchInput" placeholder="Quét mã vạch hoặc gõ tên thuốc, hoạt chất..."
          autocomplete="off" autofocus>
        <kbd>F1</kbd>
        <div id="results" class="card-x"></div>
      </div>

      <div class="card-x cart">
        <div class="cart-head">
          <h2>Giỏ hàng <span id="cartCount" class="chip gray">0 sản phẩm</span></h2>
          <button class="btn-ghost" id="clearBtn" style="padding: 4px 10px; font-size:12px"><i
              class="fa-regular fa-trash-can"></i> Hủy đơn <small class="text-muted">F4</small></button>
        </div>
        <div class="cart-body">
          <table class="tbl">
            <thead>
              <tr>
                <th>Sản phẩm</th>
                <th>ĐVT</th>
                <th>Số lượng</th>
                <th class="r">Đơn giá</th>
                <th class="r">Thành tiền</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="cartItems"></tbody>
          </table>
          <div class="empty" id="emptyCart">
            <i class="fa-solid fa-cart-shopping"></i>
            <b>Giỏ hàng đang trống</b>
            <span>Quét mã vạch hoặc gõ tên thuốc ở ô tìm kiếm phía trên</span>
          </div>
        </div>
      </div>
    </section>

    <!-- PHẢI: Khách hàng, Đơn thuốc & Thanh toán -->
    <aside class="right">
      <div class="card-x pay">
        <!-- Khách hàng -->
        <div>
          <label class="lbl" for="phoneInput">Khách hàng (SĐT)</label>
          <div class="d-flex gap-2">
            <input class="inp" id="phoneInput" type="tel" placeholder="Nhập 10 số điện thoại..." maxlength="10">
            <button class="btn-ghost" id="btnFindCust" type="button" style="white-space:nowrap">Tìm</button>
          </div>
          <div class="field-error" id="phoneError"></div>
          <div class="mt-2 text-muted small" id="custInfo"><i class="fa-regular fa-user me-1"></i> <b>Khách lẻ</b> (Mặc
            định)</div>
        </div>

        <!-- Khung Thuốc kê đơn (Tự động mở khi giỏ có thuốc LoaiThuoc = 1) -->
        <div class="rx-box" id="rxBox">
          <div class="fw-bold text-warning-emphasis mb-2"><i class="fa-solid fa-file-prescription me-1"></i> Thông tin
            đơn thuốc kê đơn</div>
          <div class="mb-2">
            <label class="lbl" for="doctorSelect">Bác sĩ kê đơn <span class="text-danger">*</span></label>
            <select class="inp" id="doctorSelect">
              <option value="">-- Chọn bác sĩ --</option>
            </select>
          </div>
          <div>
            <label class="lbl" for="diagnosisInput">Chẩn đoán <span class="text-danger">*</span></label>
            <input class="inp" id="diagnosisInput" type="text" placeholder="Ví dụ: Viêm họng cấp, Cảm cúm...">
          </div>
        </div>

        <!-- Tính tiền -->
        <div class="mt-auto">
          <div class="d-flex justify-content-between mb-2">
            <span class="text-muted">Tổng tiền hàng</span>
            <b id="subtotal">0đ</b>
          </div>
          <div class="total">
            <span>Khách cần trả</span>
            <strong id="grandTotal">0đ</strong>
          </div>
        </div>

        <div class="actions mt-3">
          <button class="btn-brand w-100 py-3 fs-5" id="payBtn" disabled>
            <i class="fa-solid fa-check me-2"></i>Thanh toán <small style="opacity:.8">F3</small>
          </button>
        </div>
      </div>
    </aside>
  </div>

  <div class="toast-x" id="toast"></div>

  <script>
    /* =====================================================
       CẤU HÌNH VÀ DỮ LIỆU GIẢ (MOCK)
    ===================================================== */
    const API_URL = 'http://localhost:3001';
    const USE_MOCK = true;

    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const money = n => (Math.round(Number(n)) || 0).toLocaleString('vi-VN') + 'đ';
    const phoneOk = s => /^0\d{9}$/.test(String(s).trim());

    function toast(msg, isError = false) {
      const t = $('toast');
      t.textContent = msg;
      t.className = 'toast-x show' + (isError ? ' error' : '');
      setTimeout(() => t.classList.remove('show'), 2400);
    }

    /* Dữ liệu MOCK Thuốc (Khớp Hợp đồng API 6.1) */
    const MOCK_THUOC = [
      { MaThuoc: 'T0001', TenThuoc: 'Paracetamol 500mg', HoatChat: 'Paracetamol', QuyCach: 'Hộp 10 vỉ x 10 viên', LoaiThuoc: 0, GiaBan: 35000, TongTonKho: 50 },
      { MaThuoc: 'T0002', TenThuoc: 'Amoxicillin 500mg', HoatChat: 'Amoxicillin', QuyCach: 'Hộp 10 vỉ x 10 viên', LoaiThuoc: 1, GiaBan: 78000, TongTonKho: 25 },
      { MaThuoc: 'T0003', TenThuoc: 'Ibuprofen 400mg', HoatChat: 'Ibuprofen', QuyCach: 'Hộp 10 vỉ x 10 viên', LoaiThuoc: 0, GiaBan: 52000, TongTonKho: 12 },
      { MaThuoc: 'T0004', TenThuoc: 'Cefuroxime 500mg', HoatChat: 'Cefuroxime', QuyCach: 'Hộp 2 vỉ x 5 viên', LoaiThuoc: 1, GiaBan: 120000, TongTonKho: 30 }
    ];

    /* Dữ liệu MOCK Bác sĩ & Khách hàng */
    const MOCK_BACSI = [
      { MaBacSi: 'BS001', HoTen: 'BS. Lê Quốc Hùng', ChuyenKhoa: 'Tai Mũi Họng' },
      { MaBacSi: 'BS002', HoTen: 'BS. Nguyễn Văn Bình', ChuyenKhoa: 'Nội khoa' }
    ];

    const MOCK_KHACHHANG = [
      { MaKhachHang: 'KH001', HoTen: 'Nguyễn Thị Lan', SoDienThoai: '0900000001' },
      { MaKhachHang: 'KH002', HoTen: 'Trần Văn Minh', SoDienThoai: '0912345678' }
    ];

    /* =====================================================
       TRẠNG THÁI GIỎ HÀNG & PHÂN HỆ
    ===================================================== */
    let cart = [];
    let selectedCustomer = null; // null = Khách lẻ
    let activeIdx = -1, shownProducts = [];

    /* 1. Tải danh sách Bác sĩ */
    function loadDoctors() {
      const sel = $('doctorSelect');
      sel.innerHTML = '<option value="">-- Chọn bác sĩ --</option>' +
        MOCK_BACSI.map(b => `<option value="${esc(b.MaBacSi)}">${esc(b.HoTen)} (${esc(b.ChuyenKhoa)})</option>`).join('');
    }

    /* 2. Tìm kiếm Thuốc */
    const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').toLowerCase();

    function renderResults() {
      const q = norm($('searchInput').value.trim());
      const box = $('results');
      if (!q) { box.style.display = 'none'; shownProducts = []; return; }

      shownProducts = MOCK_THUOC.filter(p => norm(p.TenThuoc + ' ' + p.HoatChat).includes(q)).slice(0, 8);
      activeIdx = shownProducts.length ? 0 : -1;

      box.innerHTML = shownProducts.length ? shownProducts.map((p, i) => `
    <div class="res ${i === 0 ? 'on' : ''}" data-i="${i}">
      <div>
        <div class="nm">${esc(p.TenThuoc)} ${p.LoaiThuoc === 1 ? '<span class="chip danger" style="font-size:10px">Kê đơn</span>' : ''}</div>
        <div class="sub">${esc(p.HoatChat)} · ${esc(p.QuyCach)}</div>
      </div>
      <div class="pr">
        <div>${money(p.GiaBan)}</div>
        <small class="text-muted">Tồn: ${p.TongTonKho}</small>
      </div>
    </div>`).join('') : '<div class="res" style="color:var(--muted);cursor:default">Không tìm thấy thuốc phù hợp</div>';
      box.style.display = 'block';
    }

    $('searchInput').addEventListener('input', renderResults);
    $('searchInput').addEventListener('keydown', e => {
      if (!shownProducts.length) return;
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        activeIdx = (activeIdx + (e.key === 'ArrowDown' ? 1 : -1) + shownProducts.length) % shownProducts.length;
        document.querySelectorAll('.res').forEach((el, i) => el.classList.toggle('on', i === activeIdx));
      }
      if (e.key === 'Enter' && activeIdx >= 0) pickProduct(shownProducts[activeIdx]);
      if (e.key === 'Escape') { $('results').style.display = 'none'; }
    });

    $('results').addEventListener('click', e => {
      const r = e.target.closest('.res[data-i]');
      if (r) pickProduct(shownProducts[+r.dataset.i]);
    });

    function pickProduct(p) {
      addToCart(p);
      $('searchInput').value = '';
      $('results').style.display = 'none';
      shownProducts = [];
      $('searchInput').focus();
    }

    document.addEventListener('click', e => {
      if (!e.target.closest('.search-wrap')) $('results').style.display = 'none';
    });

    /* 3. Thao tác Giỏ hàng */
    function addToCart(p) {
      const line = cart.find(item => item.MaThuoc === p.MaThuoc);
      if (line) {
        if (line.SoLuong + 1 > p.TongTonKho) {
          toast(`Số lượng tồn kho chỉ còn ${p.TongTonKho}!`, true);
          return;
        }
        line.SoLuong++;
      } else {
        if (p.TongTonKho < 1) {
          toast('Thuốc đã hết hàng trong kho!', true);
          return;
        }
        cart.push({ ...p, SoLuong: 1 });
      }
      renderCart();
    }

    function renderCart() {
      const tbody = $('cartItems');
      tbody.innerHTML = cart.map((l, i) => `
    <tr>
      <td>
        <div class="fw-bold">${esc(l.TenThuoc)}</div>
        <div class="sub">${esc(l.HoatChat)} ${l.LoaiThuoc === 1 ? '<span class="text-danger fw-bold">(Kê đơn)</span>' : ''}</div>
      </td>
      <td>${esc(l.QuyCach)}</td>
      <td>
        <div class="qty">
          <button data-a="dec" data-i="${i}">−</button>
          <input type="number" value="${l.SoLuong}" data-a="set" data-i="${i}">
          <button data-a="inc" data-i="${i}">+</button>
        </div>
      </td>
      <td class="r">${money(l.GiaBan)}</td>
      <td class="r"><b>${money(l.GiaBan * l.SoLuong)}</b></td>
      <td><button class="del" data-a="del" data-i="${i}"><i class="fa-solid fa-xmark"></i></button></td>
    </tr>`).join('');

      $('emptyCart').style.display = cart.length ? 'none' : 'flex';
      $('cartCount').textContent = cart.reduce((sum, item) => sum + item.SoLuong, 0) + ' sản phẩm';

      // Kiểm tra thuốc kê đơn trong giỏ
      const hasRx = cart.some(item => item.LoaiThuoc === 1);
      $('rxBox').classList.toggle('show', hasRx);

      updateTotals();
    }

    $('cartItems').addEventListener('click', e => {
      const btn = e.target.closest('[data-a]');
      if (!btn || btn.tagName === 'INPUT') return;
      const i = +btn.dataset.i, action = btn.dataset.a;

      if (action === 'inc') {
        if (cart[i].SoLuong + 1 > cart[i].TongTonKho) {
          toast(`Vượt quá tồn kho (${cart[i].TongTonKho})!`, true);
        } else {
          cart[i].SoLuong++;
        }
      }
      if (action === 'dec') cart[i].SoLuong = Math.max(1, cart[i].SoLuong - 1);
      if (action === 'del') cart.splice(i, 1);
      renderCart();
    });

    $('cartItems').addEventListener('change', e => {
      if (e.target.dataset.a === 'set') {
        const i = +e.target.dataset.i;
        let val = parseInt(e.target.value) || 1;
        if (val > cart[i].TongTonKho) {
          toast(`Vượt quá tồn kho (${cart[i].TongTonKho})!`, true);
          val = cart[i].TongTonKho;
        }
        cart[i].SoLuong = Math.max(1, val);
        renderCart();
      }
    });

    $('clearBtn').onclick = () => {
      if (cart.length && confirm('Hủy đơn hàng và làm trống giỏ?')) {
        cart = [];
        renderCart();
        toast('Đã hủy đơn hàng');
      }
    };

    /* 4. Tìm kiếm Khách hàng */
    $('btnFindCust').onclick = () => {
      const phone = $('phoneInput').value.trim();
      $('phoneError').textContent = '';

      if (!phone) {
        selectedCustomer = null;
        $('custInfo').innerHTML = '<i class="fa-regular fa-user me-1"></i> <b>Khách lẻ</b> (Mặc định)';
        return;
      }

      if (!phoneOk(phone)) {
        $('phoneError').textContent = 'Số điện thoại phải đủ 10 số và bắt đầu bằng 0.';
        return;
      }

      const cust = MOCK_KHACHHANG.find(c => c.SoDienThoai === phone);
      if (cust) {
        selectedCustomer = cust;
        $('custInfo').innerHTML = `<i class="fa-solid fa-user-check text-success me-1"></i> <b>${esc(cust.HoTen)}</b> (${esc(cust.MaKhachHang)})`;
        toast('Đã tìm thấy khách hàng!');
      } else {
        selectedCustomer = null;
        $('custInfo').innerHTML = `<i class="fa-solid fa-user-plus text-primary me-1"></i> Khách mới: <b>${esc(phone)}</b> (Tự tạo khi thanh toán)`;
      }
    };

    /* 5. Cập nhật Tổng tiền & Trạng thái nút Thanh toán */
    function updateTotals() {
      const grand = cart.reduce((sum, l) => sum + l.GiaBan * l.SoLuong, 0);
      $('subtotal').textContent = money(grand);
      $('grandTotal').textContent = money(grand);
      $('payBtn').disabled = !cart.length;
    }

    /* 6. Thanh toán & Kết xuất JSON */
    $('payBtn').onclick = async () => {
      if (!cart.length) return;

      const hasRx = cart.some(item => item.LoaiThuoc === 1);
      const doctorId = $('doctorSelect').value;
      const diagnosis = $('diagnosisInput').value.trim();

      // Bắt buộc nhập Bác sĩ và Chẩn đoán nếu có thuốc kê đơn
      if (hasRx) {
        if (!doctorId || !diagnosis) {
          toast('Giỏ hàng có thuốc KÊ ĐƠN: Bắt buộc chọn Bác sĩ và nhập Chẩn đoán!', true);
          return;
        }
      }

      // Kết xuất JSON đúng Hợp đồng API 6.5
      const payload = {
        MaNhanVien: 'NV001',
        MaKhachHang: selectedCustomer ? selectedCustomer.MaKhachHang : null,
        DonThuoc: hasRx ? {
          MaBacSi: doctorId,
          ChanDoan: diagnosis
        } : null,
        Items: cart.map(item => ({
          MaThuoc: item.MaThuoc,
          SoLuong: item.SoLuong
        }))
      };

      console.log('Payload gửi lên POST /api/hoadon/them:', payload);

      // Giả lập kết quả trả về từ API
      if (USE_MOCK) {
        const mockOrderCode = 'HD' + new Date().toISOString().replace(/\D/g, '').slice(0, 12);
        toast(`Thanh toán thành công! Mã đơn: ${mockOrderCode}`);

        // Reset toàn bộ màn hình
        cart = [];
        selectedCustomer = null;
        $('phoneInput').value = '';
        $('custInfo').innerHTML = '<i class="fa-regular fa-user me-1"></i> <b>Khách lẻ</b> (Mặc định)';
        $('doctorSelect').value = '';
        $('diagnosisInput').value = '';
        renderCart();
        $('searchInput').focus();
      }
    };

    /* 7. Phím tắt chuẩn F1, F3, F4 */
    document.addEventListener('keydown', e => {
      if (e.key === 'F1') {
        e.preventDefault();
        $('searchInput').focus();
        $('searchInput').select();
      }
      if (e.key === 'F3') {
        e.preventDefault();
        if (!$('payBtn').disabled) $('payBtn').click();
      }
      if (e.key === 'F4') {
        e.preventDefault();
        $('clearBtn').click();
      }
    });

    /* Đồng hồ hệ thống */
    setInterval(() => {
      $('clock').textContent = new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
    }, 1000);
    $('clock').textContent = new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });

    /* Khởi tạo */
    window.onload = () => {
      loadDoctors();
      renderCart();
    };
  </script>
</body>

</html>
