<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PharmaPro – Bán hàng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{
  --bg:#f5f7f6; --surface:#fff; --line:#e6ebe8; --ink:#16221d; --muted:#6b7a73;
  --brand:#0f766e; --brand-dark:#0b5a54; --brand-soft:#e3f3f0;
  --danger:#b42318; --danger-soft:#fdeceb; --warn:#b45309; --warn-soft:#fef3e2;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Be Vietnam Pro','Segoe UI',sans-serif;font-size:14px;display:flex;flex-direction:column;overflow:hidden}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
button{font:inherit}

/* Thanh trên: mỏng, thay cho sidebar */
.bar{height:56px;flex:none;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 20px}
.back{display:flex;align-items:center;gap:8px;color:var(--ink);text-decoration:none;font-weight:600;padding:6px 10px;border-radius:8px}
.back:hover{background:#f0f4f2;color:var(--brand-dark)}
.mark{width:28px;height:28px;border-radius:8px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:.8rem}
.bar .grow{flex:1}
.bar .meta{color:var(--muted);font-size:13px;display:flex;gap:18px;align-items:center}
.bar .meta b{color:var(--ink);font-weight:600}

/* Bố cục 2 cột */
.pos{flex:1;min-height:0;display:grid;grid-template-columns:1fr 400px;gap:16px;padding:16px 20px}
.left,.right{min-height:0;display:flex;flex-direction:column;gap:12px}
.card-x{background:var(--surface);border:1px solid var(--line);border-radius:12px}

/* Tìm kiếm */
.search-wrap{position:relative}
.search-wrap i.ic{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:#8a9a92;font-size:1.05rem}
#searchInput{width:100%;border:2px solid var(--line);border-radius:12px;padding:14px 70px 14px 46px;font-size:1.05rem;background:var(--surface)}
#searchInput:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.search-wrap kbd{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:#eef2f0;color:var(--muted);border-radius:6px;font-size:11px;padding:2px 7px}
#results{position:absolute;z-index:20;left:0;right:0;top:calc(100% + 6px);max-height:340px;overflow-y:auto;box-shadow:0 12px 30px rgba(22,34,29,.14);display:none}
.res{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.res:last-child{border-bottom:0}
.res:hover,.res.on{background:var(--brand-soft)}
.res .nm{font-weight:600}
.res .sub{font-size:12px;color:var(--muted)}
.res .pr{margin-left:auto;font-weight:600;white-space:nowrap}

/* Gợi ý nhanh */
.quick{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.quick button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:6px 14px;font-weight:500;cursor:pointer;transition:border-color .15s,background .15s}
.quick button:hover{border-color:var(--brand);background:var(--brand-soft)}
.quick span{align-self:center;color:var(--muted);font-size:12px;flex:none}

/* Giỏ hàng */
.cart{flex:1;min-height:0;display:flex;flex-direction:column}
.cart-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.cart-head h2{font-size:1rem;font-weight:600;margin:0}
.link-btn{background:none;border:0;color:var(--muted);cursor:pointer;font-size:13px}
.link-btn:hover{color:var(--danger)}
.cart-body{flex:1;overflow-y:auto}
.tbl{width:100%;border-collapse:collapse}
.tbl th{position:sticky;top:0;background:var(--surface);font-weight:500;color:var(--muted);font-size:12px;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
.tbl td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl .r{text-align:right}
.tbl .nm{font-weight:600;line-height:1.3}
.tbl .sub{font-size:12px;color:var(--muted)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.qty button{width:30px;height:32px;border:0;background:#f5f7f6;cursor:pointer;color:var(--ink)}
.qty button:hover{background:var(--brand-soft)}
.qty input{width:44px;height:32px;border:0;text-align:center;font-weight:600;-moz-appearance:textfield}
.qty input::-webkit-outer-spin-button,.qty input::-webkit-inner-spin-button{-webkit-appearance:none}
.del{border:0;background:none;color:#98a69f;cursor:pointer;padding:6px 8px;border-radius:6px}
.del:hover{background:var(--danger-soft);color:var(--danger)}
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);gap:6px;padding:40px 0;text-align:center}
.empty i{font-size:2.2rem;color:#c3cfc9;margin-bottom:6px}

/* Thanh toán */
.pay{flex:1;display:flex;flex-direction:column;padding:18px;gap:14px;min-height:0;overflow-y:auto}
.lbl{font-size:12px;color:var(--muted);font-weight:500;margin-bottom:6px;display:block}
.inp{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.inp:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.cust{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:13px}
.tag{background:var(--brand-soft);color:var(--brand-dark);border-radius:20px;padding:2px 10px;font-weight:500;font-size:12px}
.rx{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.rx input{accent-color:var(--brand);width:16px;height:16px}
#rxBox{display:none}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 4px;font-weight:500;cursor:pointer;transition:all .15s}
.seg button.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-dark);font-weight:600}
.sum{display:flex;justify-content:space-between;color:var(--muted)}
.sum b{color:var(--ink);font-weight:600}
.total{display:flex;justify-content:space-between;align-items:baseline;padding-top:12px;border-top:1px dashed var(--line)}
.total span{font-weight:600}
.total strong{font-size:1.9rem;color:var(--brand-dark);letter-spacing:-.5px}
.cash-quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.cash-quick button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer}
.cash-quick button:hover{border-color:var(--brand);background:var(--brand-soft)}
.change{display:flex;justify-content:space-between;margin-top:8px;font-weight:600}
.change.neg b{color:var(--danger)}
.actions{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.btn-pay{background:var(--brand);color:#fff;border:0;border-radius:12px;padding:16px;font-size:1.1rem;font-weight:700;cursor:pointer;transition:background .15s}
.btn-pay:hover:not(:disabled){background:var(--brand-dark)}
.btn-pay:disabled{background:#b9c8c3;cursor:not-allowed}
.btn-pay small{opacity:.75;font-weight:500;margin-left:6px}
.btn-ghost{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px;font-weight:500;cursor:pointer}
.btn-ghost:hover{background:#f0f4f2}

.toast-x{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:10px;opacity:0;pointer-events:none;transition:all .25s;z-index:50}
.toast-x.show{opacity:1;transform:translateX(-50%)}

@media (max-width:991px){
  body{overflow:auto}
  .pos{grid-template-columns:1fr;display:flex;flex-direction:column}
  .bar .meta{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="bar">
  <a href="index.html" class="back"><i class="fa-solid fa-arrow-left"></i><span class="mark"><i class="fa-solid fa-staff-snake"></i></span>PharmaPro</a>
  <span class="grow"></span>
  <div class="meta">
    <span>Dược sĩ: <b>Phạm Trường Sơn</b></span>
    <span><i class="fa-regular fa-clock"></i> <b id="clock">--:--</b></span>
  </div>
</header>

<div class="pos">
  <!-- TRÁI: tìm kiếm + giỏ hàng -->
  <section class="left">
    <div class="search-wrap">
      <i class="fa-solid fa-magnifying-glass ic"></i>
      <input type="text" id="searchInput" placeholder="Quét mã vạch hoặc gõ tên thuốc, hoạt chất" autocomplete="off" autofocus>
      <kbd>F1</kbd>
      <div id="results" class="card-x"></div>
    </div>

    <div class="quick" id="quick"><span>Hay bán:</span></div>

    <div class="card-x cart">
      <div class="cart-head">
        <h2>Giỏ hàng <span id="cartCount" class="tag">0 sản phẩm</span></h2>
        <button class="link-btn" id="clearBtn"><i class="fa-regular fa-trash-can"></i> Hủy đơn <small>F4</small></button>
      </div>
      <div class="cart-body">
        <table class="tbl">
          <thead><tr><th>Sản phẩm</th><th>ĐVT</th><th>Số lượng</th><th class="r">Đơn giá</th><th class="r">Thành tiền</th><th></th></tr></thead>
          <tbody id="cartItems"></tbody>
        </table>
        <div class="empty" id="emptyCart"><i class="fa-solid fa-cart-shopping"></i><b>Giỏ hàng đang trống</b><span>Quét mã vạch hoặc gõ tên thuốc ở ô tìm kiếm phía trên</span></div>
      </div>
    </div>
  </section>

  <!-- PHẢI: khách hàng + thanh toán -->
  <aside class="right">
    <div class="card-x pay">
      <div>
        <label class="lbl" for="phone">Khách hàng</label>
        <input class="inp" id="phone" type="tel" placeholder="Nhập số điện thoại để tìm khách">
        <div class="cust"><i class="fa-regular fa-user"></i> Khách lẻ <span class="tag">Mặc định</span></div>
      </div>

      <label class="rx"><input type="checkbox" id="rxCheck"> Bán theo đơn thuốc</label>
      <div id="rxBox"><input class="inp" placeholder="Tên bác sĩ / cơ sở kê đơn"></div>

      <div>
        <span class="lbl">Hình thức thanh toán</span>
        <div class="seg" id="method">
          <button class="on" data-m="cash">Tiền mặt</button>
          <button data-m="bank">Chuyển khoản</button>
          <button data-m="debt">Ghi nợ</button>
        </div>
      </div>

      <div>
        <div class="sum"><span>Tổng tiền hàng</span><b id="subtotal">0đ</b></div>
        <div class="sum mt-2 align-items-center"><span>Giảm giá</span>
          <input class="inp" id="discount" type="number" min="0" value="0" style="width:130px;text-align:right;padding:5px 10px" aria-label="Giảm giá">
        </div>
      </div>

      <div class="total"><span>Khách cần trả</span><strong id="grand">0đ</strong></div>

      <div id="cashBox">
        <label class="lbl" for="received">Khách đưa</label>
        <input class="inp" id="received" type="number" min="0" placeholder="0">
        <div class="cash-quick" id="cashQuick"></div>
        <div class="change" id="changeRow"><span>Tiền thừa</span><b id="change">0đ</b></div>
      </div>

      <div class="actions">
        <button class="btn-pay" id="payBtn" disabled>Thanh toán <small>F3</small></button>
        <button class="btn-ghost" id="saveBtn">Lưu tạm đơn hàng</button>
      </div>
    </div>
  </aside>
</div>

<div class="toast-x" id="toast"></div>

<script>
const API = 'http://localhost:3000/api/thuoc/danhsach';
// Giả định: API trả về TenThuoc, HoatChat, QuyCach; nếu có GiaBan / DonViTinh thì dùng, không thì lấy giá trị mặc định bên dưới.
const FALLBACK_PRICE = 25000, FALLBACK_UNIT = 'Hộp';

let products = [], cart = [], method = 'cash', activeIdx = -1, shown = [];
const $ = id => document.getElementById(id);
const money = n => (Math.round(n) || 0).toLocaleString('vi-VN') + 'đ';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---- Dữ liệu thuốc ---- */
async function loadProducts() {
  try {
    const res = await fetch(API);
    const data = await res.json();
    products = data.map((t, i) => ({
      id: t.MaThuoc ?? t.id ?? i,
      name: t.TenThuoc, ingredient: t.HoatChat || '', spec: t.QuyCach || '',
      unit: t.DonViTinh || FALLBACK_UNIT, price: Number(t.GiaBan) || FALLBACK_PRICE
    }));
    $('quick').innerHTML = '<span>Hay bán:</span>' + products.slice(0, 6)
      .map(p => `<button data-id="${esc(p.id)}">${esc(p.name)}</button>`).join('');
  } catch (e) {
    $('quick').innerHTML = '<span style="color:var(--danger)"><i class="fa-solid fa-plug-circle-xmark"></i> Không kết nối được máy chủ dữ liệu (localhost:3000)</span>';
  }
}
$('quick').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const p = products.find(x => String(x.id) === b.dataset.id); if (p) addToCart(p);
});

/* ---- Tìm kiếm ---- */
const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').toLowerCase();
function renderResults() {
  const q = norm($('searchInput').value.trim());
  const box = $('results');
  if (!q) { box.style.display = 'none'; shown = []; return; }
  shown = products.filter(p => norm(p.name + ' ' + p.ingredient).includes(q)).slice(0, 8);
  activeIdx = shown.length ? 0 : -1;
  box.innerHTML = shown.length ? shown.map((p, i) => `
    <div class="res ${i === 0 ? 'on' : ''}" data-i="${i}">
      <div><div class="nm">${esc(p.name)}</div><div class="sub">${esc(p.ingredient)} ${p.spec ? '· ' + esc(p.spec) : ''}</div></div>
      <span class="pr">${money(p.price)}</span>
    </div>`).join('') : '<div class="res" style="color:var(--muted);cursor:default">Không tìm thấy thuốc phù hợp</div>';
  box.style.display = 'block';
}
$('searchInput').addEventListener('input', renderResults);
$('searchInput').addEventListener('keydown', e => {
  if (!shown.length) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    activeIdx = (activeIdx + (e.key === 'ArrowDown' ? 1 : -1) + shown.length) % shown.length;
    document.querySelectorAll('.res').forEach((el, i) => el.classList.toggle('on', i === activeIdx));
  }
  if (e.key === 'Enter' && activeIdx >= 0) pick(shown[activeIdx]);
  if (e.key === 'Escape') { $('results').style.display = 'none'; }
});
$('results').addEventListener('click', e => {
  const r = e.target.closest('.res[data-i]'); if (r) pick(shown[+r.dataset.i]);
});
function pick(p) {
  addToCart(p);
  $('searchInput').value = ''; $('results').style.display = 'none'; shown = [];
  $('searchInput').focus();
}
document.addEventListener('click', e => { if (!e.target.closest('.search-wrap')) $('results').style.display = 'none'; });

/* ---- Giỏ hàng ---- */
function addToCart(p) {
  const line = cart.find(l => l.id === p.id);
  line ? line.qty++ : cart.push({ ...p, qty: 1 });
  render();
}
function render() {
  $('cartItems').innerHTML = cart.map((l, i) => `
    <tr>
      <td><div class="nm">${esc(l.name)}</div><div class="sub">${esc(l.ingredient)} ${l.spec ? '· ' + esc(l.spec) : ''}</div></td>
      <td>${esc(l.unit)}</td>
      <td><div class="qty"><button data-a="dec" data-i="${i}" aria-label="Giảm">−</button>
        <input type="number" min="1" value="${l.qty}" data-a="set" data-i="${i}" aria-label="Số lượng">
        <button data-a="inc" data-i="${i}" aria-label="Tăng">+</button></div></td>
      <td class="r">${money(l.price)}</td>
      <td class="r"><b>${money(l.price * l.qty)}</b></td>
      <td><button class="del" data-a="del" data-i="${i}" aria-label="Xóa dòng"><i class="fa-solid fa-xmark"></i></button></td>
    </tr>`).join('');
  $('emptyCart').style.display = cart.length ? 'none' : 'flex';
  $('cartCount').textContent = cart.reduce((s, l) => s + l.qty, 0) + ' sản phẩm';
  totals();
}
$('cartItems').addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b || b.tagName === 'INPUT') return;
  const i = +b.dataset.i, a = b.dataset.a;
  if (a === 'inc') cart[i].qty++;
  if (a === 'dec') cart[i].qty = Math.max(1, cart[i].qty - 1);
  if (a === 'del') cart.splice(i, 1);
  render();
});
$('cartItems').addEventListener('change', e => {
  if (e.target.dataset.a === 'set') { cart[+e.target.dataset.i].qty = Math.max(1, parseInt(e.target.value) || 1); render(); }
});
$('clearBtn').onclick = () => { if (cart.length && confirm('Hủy đơn hàng hiện tại?')) { cart = []; render(); } };

/* ---- Tính tiền ---- */
let grand = 0;
function totals() {
  const sub = cart.reduce((s, l) => s + l.price * l.qty, 0);
  const disc = Math.min(Math.max(+$('discount').value || 0, 0), sub);
  grand = sub - disc;
  $('subtotal').textContent = money(sub);
  $('grand').textContent = money(grand);
  const quick = [grand, 50000, 100000, 200000, 500000].filter((v, i) => v > 0 && (i === 0 || v > grand));
  $('cashQuick').innerHTML = quick.map((v, i) => `<button data-v="${v}">${i === 0 ? 'Đủ tiền' : money(v)}</button>`).join('');
  const got = +$('received').value || 0, diff = got - grand;
  $('change').textContent = money(Math.abs(diff));
  $('changeRow').classList.toggle('neg', diff < 0 && got > 0);
  $('changeRow').firstElementChild.textContent = diff < 0 && got > 0 ? 'Còn thiếu' : 'Tiền thừa';
  $('payBtn').disabled = !cart.length || (method === 'cash' && got > 0 && got < grand);
}
$('discount').addEventListener('input', totals);
$('received').addEventListener('input', totals);
$('cashQuick').addEventListener('click', e => {
  const b = e.target.closest('button'); if (b) { $('received').value = b.dataset.v; totals(); }
});
$('method').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  method = b.dataset.m;
  document.querySelectorAll('#method button').forEach(x => x.classList.toggle('on', x === b));
  $('cashBox').style.display = method === 'cash' ? 'block' : 'none';
  totals();
});
$('rxCheck').addEventListener('change', e => { $('rxBox').style.display = e.target.checked ? 'block' : 'none'; });

/* ---- Thanh toán / Lưu tạm ---- */
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2200); }
function reset() { cart = []; $('discount').value = 0; $('received').value = ''; render(); $('searchInput').focus(); }
function checkout() {
  if ($('payBtn').disabled) return;
  // TODO: gửi đơn lên API (POST) tại đây trước khi reset
  toast('Đã thanh toán ' + money(grand)); reset();
  localStorage.removeItem('pos_draft');
}
$('payBtn').onclick = checkout;
$('saveBtn').onclick = () => {
  if (!cart.length) return toast('Giỏ hàng đang trống');
  localStorage.setItem('pos_draft', JSON.stringify(cart)); toast('Đã lưu tạm đơn hàng'); reset();
};

/* ---- Phím tắt (F1 tìm kiếm, F3 thanh toán, F4 hủy đơn) & đồng hồ ---- */
document.addEventListener('keydown', e => {
  if (e.key === 'F1') { e.preventDefault(); $('searchInput').focus(); $('searchInput').select(); }
  if (e.key === 'F3') { e.preventDefault(); checkout(); }
  if (e.key === 'F4') { e.preventDefault(); $('clearBtn').click(); }
});
setInterval(() => $('clock').textContent = new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }), 1000);
$('clock').textContent = new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });

window.onload = () => {
  $('searchInput').focus();
  try { const d = JSON.parse(localStorage.getItem('pos_draft') || 'null'); if (d && d.length) { cart = d; toast('Đã khôi phục đơn lưu tạm'); } } catch (e) {}
  render(); loadProducts();
};
</script>
</body>
</html>
