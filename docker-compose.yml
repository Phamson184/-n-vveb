version: '3.8'

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: database-db-1
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong@Passw0rd123
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
      - ./ddl.sql:/docker-entrypoint-initdb.d/ddl.sql
      - ./seed.sql:/docker-entrypoint-initdb.d/seed.sql
    entrypoint:
      - /bin/bash
      - -c
      - |
        # Khởi động SQL Server ngầm ở background
        /opt/mssql/bin/sqlservr &
        
        # Vòng lặp chờ cho tới khi SQL Server sẵn sàng nhận kết nối
        echo "Đang chờ SQL Server khởi động để tự động nạp dữ liệu..."
        until /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "YourStrong@Passw0rd123" -Q "SELECT 1" -C &> /dev/null
        do
          sleep 2
        done
        
        echo "SQL Server đã sẵn sàng! Đang tiến hành tự động nạp DDL và Seed..."
        
        # Kiểm tra xem database đã được khởi tạo trước đó chưa (dựa vào việc bảng THUOC đã tồn tại chưa)
        TABLE_EXISTS=$("/opt/mssql-tools18/bin/sqlcmd" -S localhost -U sa -P "YourStrong@Passw0rd123" -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_NAME = 'THUOC'" -h -1 -C | tr -d '[:space:]')
        
        if [ "$TABLE_EXISTS" = "0" ] || [ -z "$TABLE_EXISTS" ]; then
          echo "-> Đang chạy ddl.sql..."
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "YourStrong@Passw0rd123" -C -i /docker-entrypoint-initdb.d/ddl.sql
          
          echo "-> Đang chạy seed.sql..."
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "YourStrong@Passw0rd123" -C -i /docker-entrypoint-initdb.d/seed.sql
          echo "=== KHỞI TẠO CƠ SỞ DỮ LIỆU TỰ ĐỘNG THÀNH CÔNG! ==="
        else
          echo "=== CƠ SỞ DỮ LIỆU ĐÃ TỒN TỪ TRƯỚC, BỎ QUA BƯỚC SEED ĐỂ BẢO VỆ DỮ LIỆU! ==="
        fi
        
        # Giữ container chạy tiến trình chính của SQL Server ởForeground
        wait
    restart: always

  api:
    build:
      context: ./api-php
      dockerfile: Dockerfile
    container_name: database-api-1
    ports:
      - "3001:3000"
    volumes:
      - ./api-php:/app
    depends_on:
      - db
    restart: always

  frontend:
    image: nginx:alpine
    container_name: database-frontend-1
    ports:
      - "8082:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
    restart: always

volumes:
  sql_data: